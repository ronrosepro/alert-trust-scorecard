name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install test tools
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.5 -Force
          Install-Module PSScriptAnalyzer -Force

      - name: Lint (PSScriptAnalyzer)
        shell: pwsh
        run: |
          $findings = @('./src', './scripts' | ForEach-Object { Invoke-ScriptAnalyzer -Path $_ -Recurse -Severity Warning, Error })
          $findings | Format-Table RuleName, ScriptName, Line, Message -AutoSize
          if ($findings.Count -gt 0) { throw "$($findings.Count) analyzer finding(s)" }

      - name: Unit tests (Pester)
        shell: pwsh
        run: |
          $cfg = New-PesterConfiguration
          $cfg.Run.Path = './tests'
          $cfg.Run.Exit = $true
          $cfg.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $cfg

      - name: Build sample report
        shell: pwsh
        run: |
          Import-Module ./src/AlertTrust/AlertTrust.psd1
          $r = Invoke-AlertTrustScorecard -AlertPath ./samples/alerts.csv -TicketPath ./samples/tickets.csv `
            -OwnerPath ./samples/owners.csv -ColumnMapPath ./config/column-map.json -OutputDirectory ./out
          "Trust $($r.Summary.TrustScorePct)% -> $($r.Projection.ProjectedTrustPct)% after retiring noisy rules"

      - uses: actions/upload-artifact@v4
        with:
          name: sample-report
          path: out/
